<!-- aria-label names the checkbox for screen readers, but there is no label element, so clicking the text still does nothing. -->
<!--
  Product filters on the category page. The accessibility audit flagged these
  checkboxes: each needs a label tied to it.
-->
<form>
  <input type="checkbox" name="in-stock" id="filter-in-stock" aria-label="in-stock"> in-stock
  <input type="checkbox" name="on-sale" id="filter-on-sale" aria-label="on-sale"> on-sale
</form>
