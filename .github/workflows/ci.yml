name: CI
on: [push, pull_request]
permissions:
  contents: read
# Production deploys from main run one at a time, in order; other runs never wait.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || github.run_id }}
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The Go, C# and Java runners are built from source in Docker; their builds are cached
      # by their inputs. The build still checks every file against its pinned hash.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/muscle-memory-runtimes
          key: runtimes-${{ hashFiles('tools/build-runtimes.mjs', 'tools/runtimes/**') }}
      - run: npm test
      # Every revision the build made must be archived in the commit (tools/build-content.ts).
      - run: test -z "$(git status --porcelain content/revisions)"
      - run: npm run typecheck
      - run: npm run build:cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
      # main deploys to production once everything above passed (docs/cloudflare-build.md): the
      # ingest Worker first, so it accepts what the new app records, then the app. Workers Builds
      # can't do this: it has no Docker for the Go, C# and Java runners.
      - name: Deploy the ingest Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config apps/ingest/wrangler.jsonc --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 166fd3dff06a9c3f1aef172a25db7ace
          WRANGLER_SEND_METRICS: 'false'
      - name: Deploy the app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config apps/web/wrangler.jsonc --message "main ${GITHUB_SHA::7}, GitHub Actions run ${GITHUB_RUN_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 166fd3dff06a9c3f1aef172a25db7ace
          WRANGLER_SEND_METRICS: 'false'
  erasure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/erasure/requirements-test.txt
      - run: python -m unittest -v test_erase
        working-directory: tools/erasure
  model-runs-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The same Iceberg stack as the erasure job.
      - run: pip install -r tools/erasure/requirements-test.txt
      - run: python -m unittest -v test_store_events
        working-directory: tools/model-runs
