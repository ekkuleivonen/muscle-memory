name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=packages/core python -m unittest discover -s packages/core/tests -v
      - run: PYTHONPATH=packages/core python apps/reference/demo.py
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/tests/content-check.test.mjs
      - run: node tools/content-check.mjs
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The Go, C# and Java runners are built from source in Docker; their builds are cached
      # by their inputs. The build still checks every file against its pinned hash.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/muscle-memory-runtimes
          key: runtimes-${{ hashFiles('tools/build-runtimes.mjs', 'tools/runtimes/**') }}
      - run: npm test
      - run: npm run check:content
      - run: npm run build:cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
