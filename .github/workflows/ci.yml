name: CI
on: [push, pull_request]
permissions:
  contents: read
# CI never deploys: production is deployed from the operator's Mac with `npm run deploy`
# (docs/cloudflare-build.md#deploying), so no Cloudflare deploy token is stored here.
jobs:
  catalog-contracts:
    # Public/fork PRs never receive catalog credentials, private copies or artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:catalog-contracts
      - run: npm run test:owner-rpc
      - run: node tools/comparison-control-check.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install datafusion==50.1.0
      - run: node --import tsx tools/history-query-check.ts
      - run: node --import tsx tools/cohort-query-check.ts
  web:
    needs: catalog-contracts
    # Only code pushed by trusted repository writers may read private authoring material.
    # Never use pull_request_target to hydrate a fork's checkout.
    if: github.event_name == 'push' && github.repository == 'ekkuleivonen/muscle-memory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read private managed catalog (dedicated read access required)
        run: npm run catalog:pull
        env:
          CATALOG_READ_TOKEN: ${{ secrets.CATALOG_READ_TOKEN }}
      # The Go, C# and Java runners are built from source in Docker; their builds are cached
      # by their inputs. The build still checks every file against its pinned hash.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/muscle-memory-runtimes
          key: runtimes-${{ hashFiles('tools/build-runtimes.mjs', 'tools/runtimes/**') }}
      # Logs can contain assertion diffs with private QA. Keep them local to the runner;
      # never upload .local, catalog copies, test traces, or build output as public artifacts.
      - run: node tools/private-check.mjs test
      - run: node tools/private-check.mjs typecheck
      - run: node tools/private-check.mjs build:cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
  erasure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/erasure/requirements-test.txt
      - run: python -m unittest -v test_erase
        working-directory: tools/erasure
      # The image the erasure Worker runs (apps/erasure); deployed by hand, so check it builds here.
      - run: docker build --platform linux/amd64 tools/erasure
  model-runs-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The same Iceberg stack as the erasure job.
      - run: pip install -r tools/erasure/requirements-test.txt
      - run: python -m unittest -v test_store_events
        working-directory: tools/model-runs
