name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The Go, C# and Java runners are built from source in Docker; their builds are cached
      # by their inputs. The build still checks every file against its pinned hash.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/muscle-memory-runtimes
          key: runtimes-${{ hashFiles('tools/build-runtimes.mjs', 'tools/runtimes/**') }}
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:content
      - run: npm run build:cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
  erasure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r tools/erasure/requirements-test.txt
      - run: python -m unittest -v test_erase
        working-directory: tools/erasure
      - run: python -m unittest -v test_aggregate
        working-directory: tools/aggregates
